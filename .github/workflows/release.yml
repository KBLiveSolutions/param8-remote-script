name: Release param8.zip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build param8.zip
        run: |
          mkdir dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='dist/' \
            . dist/param8/
          cd dist && zip -r ../param8.zip param8/

      - name: Recreate latest release
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest param8.zip \
            --title "Latest" \
            --notes "Latest build. Download param8.zip and place the param8 folder in your Ableton Remote Scripts directory."
        env:
          GH_TOKEN: ${{ github.token }}
